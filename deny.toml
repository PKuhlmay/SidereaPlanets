# cargo-deny configuration (PLANETS-7). Run: `cargo deny check` (CI runs the same command).
# Siderea Planets is GPL-3.0-or-later, so every dependency licence must be compatible with GPL-3.0.
# The same list of platforms is used by about.toml for the third-party notice that ships with the app.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Test-only crates are not shipped.
exclude-dev = true

[licenses]
# Only GPL-3.0-compatible licences that actually occur in the dependency tree. Add one only after checking
# it against https://www.gnu.org/licenses/license-list.html.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace crates themselves are GPL-3.0-or-later and not published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
# Advisories come from the RustSec database. Unmaintained and yanked crates warn, vulnerabilities fail.
yanked = "warn"
unmaintained = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
