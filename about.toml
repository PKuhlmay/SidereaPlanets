# cargo-about configuration (PLANETS-7): the licence texts of the Rust dependencies for the third-party notice in About.
# `pnpm gen:licenses` (in app/) runs `cargo about generate --format json` with this file and merges the result with the npm
# packages into app/public/third-party-licenses.html. The accepted list matches deny.toml.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "ISC",
    "MIT-0",
    "Unlicense",
]

# The platforms the app is shipped for (the same list as in deny.toml).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Tests and build scripts are not part of the shipped app.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# The workspace crates are the app itself (GPL-3.0-or-later).
private = { ignore = true }
