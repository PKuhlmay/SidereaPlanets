[package]
name = "planets-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Siderea Planets desktop app (Tauri shell)"

[lib]
# The `_lib` suffix keeps the lib name unique next to the bin name (Windows linker issue).
name = "planets_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
planets-core = { path = "../../crates/core" }
planets-io = { path = "../../crates/io" }
planets-session = { path = "../../crates/session" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The orientation of Flip and Rotate comes as JSON in a header of the raw-body command `orient_preview`.
serde_json = "1"
# CPU time and memory of the app for the status bar, without unsafe code of our own.
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
# Relaunch after an update (PLANETS-13).
tauri-plugin-process = "2"

# Auto-updater from GitHub Releases (PLANETS-13); desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

