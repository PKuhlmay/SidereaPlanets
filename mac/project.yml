# xcodegen specification of the Mac app (MAC-005). `cd mac && xcodegen generate` writes SidereaPlanets.xcodeproj (not in Git);
# scripts/deploy-mac.sh does that and builds. The Rust core comes in through the local Swift package SidereaPlanetsKit, whose
# XCFramework scripts/build-ffi.sh builds first.
name: SidereaPlanets
options:
  bundleIdPrefix: de.kuhlmay
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SidereaPlanetsKit:
    path: Packages/SidereaPlanetsKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # Ad-hoc signing ("Sign to Run Locally"): no Developer ID yet, see mac/README.md.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SidereaPlanets:
    type: application
    platform: macOS
    sources:
      - App
      # The user pages of the Help window: the shared Markdown files of the Windows app, copied into the bundle as the folder
      # `pages` (no second copy in Git).
      - path: ../app/src/docs/pages
        type: folder
        buildPhase: resources
      # Icon Composer icons (macOS 26 format), shared with the Windows icon (docs/design/icon, scripts/make-icons.sh).
      - path: ../docs/design/icon/AppIcon.icon
        type: file
        buildPhase: resources
      - path: ../docs/design/icon/AppIconDev.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: SidereaPlanetsKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Siderea Planets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.photography
        # The project file is a type of its own (JSON inside), so a saved .rkproj is recognised and selectable in Open Project.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: de.kuhlmay.siderea.planets.project
            UTTypeDescription: Siderea Planets project
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [rkproj]
        NSHumanReadableCopyright: "Siderea Planets, stacking and sharpening for planetary astrophotography."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kuhlmay.siderea.planets
        # The app is called Siderea Planets (MAC-013); target, scheme and Swift module keep the internal name SidereaPlanets,
        # so `@testable import SidereaPlanets` and the build commands stay as they are.
        PRODUCT_NAME: Siderea Planets
        PRODUCT_MODULE_NAME: SidereaPlanets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Debug app wears an accent-colored DEV badge, so it is told apart from the installed one in the Dock.
        "ASSETCATALOG_COMPILER_APPICON_NAME[config=Debug]": AppIconDev
        # The app is not sandboxed for now: it opens recordings anywhere on disk (mac/README.md).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
  SidereaPlanetsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: SidereaPlanets
      - package: SidereaPlanetsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kuhlmay.siderea.planets.tests
        # xcodegen derives the test host from the target name; the app product is called Siderea Planets (MAC-013).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Siderea Planets.app/Contents/MacOS/Siderea Planets"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SidereaPlanets:
    build:
      targets:
        SidereaPlanets: all
        SidereaPlanetsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SidereaPlanetsTests
