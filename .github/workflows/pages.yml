name: Pages

# Publishes the project site (site/) with the user docs rendered from app/src/docs/pages/.
# Needs Settings > Pages > Source: GitHub Actions in the repository.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "app/src/docs/pages/**"
      # Inputs of the build besides the site folder: the docs parser and the design tokens.
      - "app/src/docs/docs.ts"
      - "app/package.json"
      - "app/pnpm-lock.yaml"
      - "docs/design/tokens.css"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # The site build reuses the docs parser of the app and its markdown library.
      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the site
        run: node site/build.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
