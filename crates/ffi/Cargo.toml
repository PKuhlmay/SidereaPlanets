[package]
name = "planets-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "UniFFI interface of the SidereaPlanets session for the native Mac app (Swift)"

[lib]
name = "planets_ffi"
# The static library goes into SidereaPlanetsFFI.xcframework; `lib` keeps the crate usable from `cargo test`.
crate-type = ["staticlib", "lib"]

[dependencies]
planets-core = { path = "../core" }
planets-io = { path = "../io" }
planets-session = { path = "../session" }
serde_json = "1"
thiserror = "2"
# `cli` brings the bindgen entry point for src/bin/uniffi-bindgen.rs, so the bindings are generated with exactly this version.
uniffi = { version = "0.32.2", features = ["cli"] }

# No `[lints] workspace = true` on purpose: the workspace forbids `unsafe_code`, but the scaffolding that
# `uniffi::setup_scaffolding!` and the derive macros generate is `extern "C"` code full of `unsafe`.
# `unsafe` is therefore allowed in this crate and only here; the hand-written code below does not use it,
# and every other crate keeps `forbid`. Clippy's default `all` group is switched on again explicitly.
[lints.clippy]
all = { level = "warn", priority = -1 }
